name: Daily Job Crawl

on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run daily pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_URL: ${{ secrets.ANTHROPIC_API_URL }}
          RESUME_PROFILE: ${{ secrets.RESUME_PROFILE }}
          RESUME_PROFILE_URL: ${{ secrets.RESUME_PROFILE_URL }}
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/daily_run.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: output/daily_report.md
          if-no-files-found: warn
